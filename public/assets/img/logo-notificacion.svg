<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <!-- Defs para Gradiente Institucional -->
  <defs>
    <linearGradient id="notifGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47" />
      <stop offset="60%" stop-color="#0F355C" />
      <stop offset="100%" stop-color="#0A1E34" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0E2A47" />
    </linearGradient>
  </defs>

  <!-- Fondo Panorámico Azul Oscuro -->
  <rect width="600" height="220" rx="16" fill="url(#notifGrad)"/>

  <!-- BLOQUE CABECERA MARCA (Isotipo + Nombre Expandido) -->
  <g transform="translate(35, 35)">
    <!-- Isotipo -->
    <circle cx="45" cy="45" r="38" fill="none" stroke="#06B6D4" stroke-width="8"/>
    <circle cx="33" cy="45" r="7" fill="#FFFFFF"/>
    <circle cx="57" cy="45" r="9" fill="#10B981"/>
    <path d="M 33 45 Q 45 30 57 45 Q 45 60 33 45 Z" fill="#FFFFFF" opacity="0.3"/>

    <!-- Nombre O R I G E N con máximo espaciado -->
    <text x="105" y="42" font-family="'Montserrat', Arial, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="8">ORIGEN</text>
    
    <!-- Subtítulo Limpio -->
    <text x="107" y="62" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="11" fill="#06B6D4" letter-spacing="2.5">CENTRO MÉDICO &amp; DIAGNÓSTICO</text>
  </g>

  <!-- LÍNEA DIVISORA DE FLUIDEZ -->
  <rect x="35" y="130" width="530" height="2" rx="1" fill="url(#accentGrad)"/>

  <!-- BLOQUE DE NOTIFICACIÓN (Dinamizable) -->
  <g transform="translate(35, 160)">
    <text x="0" y="20" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="14" fill="#E2E8F0" letter-spacing="0.5">📅 NOTIFICACIÓN DE TURNO MÉDICO</text>
    
    <!-- Badge de Estado (Derecha) -->
    <rect x="420" y="2" width="110" height="26" rx="13" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="475" y="19" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="11" fill="#10B981" text-anchor="middle">CONFIRMADO</text>
  </g>
</svg>
