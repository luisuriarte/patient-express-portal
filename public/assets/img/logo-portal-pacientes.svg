<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 85" width="100%" height="100%">
  <defs>
    <!-- Gradiente Institucional de Origen -->
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO (Símbolo de Marca) -->
  <g transform="translate(10, 8)">
    <circle cx="35" cy="35" r="28" fill="none" stroke="url(#portalGrad)" stroke-width="6.5"/>
    <circle cx="26" cy="35" r="5" fill="#06B6D4"/>
    <circle cx="44" cy="35" r="6.5" fill="#10B981"/>
    <path d="M 26 35 Q 35 24 44 35 Q 35 46 26 35 Z" fill="url(#portalGrad)" opacity="0.3"/>
  </g>

  <!-- MARCA: ORIGEN (Expandida) -->
  <text x="92" y="42" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#0E2A47" letter-spacing="7">ORIGEN</text>

  <!-- SUBTÍTULO: CENTRO MÉDICO -->
  <text x="93" y="56" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="9" fill="#475569" letter-spacing="2">CENTRO MÉDICO &amp; DIAGNÓSTICO</text>

  <!-- SEPARADOR VERTICAL -->
  <line x1="322" y1="20" x2="322" y2="60" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- INSIGNIA / BADGE: PORTAL PACIENTES -->
  <g transform="translate(334, 25)">
    <!-- Pastilla de Fondo Turquesa Suave -->
    <rect x="0" y="0" width="112" height="26" rx="13" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Texto de Insignia -->
    <text x="56" y="17" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="9.5" fill="#0284C7" text-anchor="middle" letter-spacing="1">PORTAL PACIENTES</text>
  </g>
</svg>
