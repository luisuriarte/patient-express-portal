<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Fondo circular azul oscuro de alto contraste para pestañas claras y oscuras -->
  <circle cx="64" cy="64" r="60" fill="#0E2A47"/>

  <!-- Gradiente sutil del anillo -->
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Anillo Cyan/Verde -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="url(#favGrad)" stroke-width="10"/>

  <!-- Nodos Internos (Blanco + Verde Esmeralda) -->
  <circle cx="50" cy="64" r="7" fill="#FFFFFF"/>
  <circle cx="78" cy="64" r="9" fill="#10B981"/>
  
  <!-- Intersección sutil -->
  <path d="M 50 64 Q 64 50 78 64 Q 64 78 50 64 Z" fill="#FFFFFF" opacity="0.3"/>
</svg>
