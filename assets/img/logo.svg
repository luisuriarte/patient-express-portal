<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fondo Redondeado en Azul Premium -->
  <rect width="400" height="400" rx="80" fill="#0E2A47"/>
  
  <g transform="translate(50, 50)">
    <!-- Anillo Símbolo Gradiente Blanco / Turquesa -->
    <circle cx="150" cy="150" r="110" fill="none" stroke="#06B6D4" stroke-width="22"/>
    
    <!-- Figuras Familia / Cuidado interior -->
    <circle cx="120" cy="150" r="22" fill="#FFFFFF"/>
    <circle cx="180" cy="150" r="28" fill="#10B981"/>
    <path d="M 120 150 Q 150 110 180 150 Q 150 190 120 150 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>
