<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="100%" height="auto" class="mx-auto mb-4">
  <defs>
    <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO CENTRADO -->
  <g transform="translate(100, 10)">
    <path d="M 50 10 A 38 38 0 1 0 88 48 A 38 38 0 0 0 50 10 Z" fill="none" stroke="url(#loginGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="40" cy="48" r="6" fill="#06B6D4"/>
    <circle cx="60" cy="48" r="8" fill="#10B981"/>
    <path d="M 40 48 Q 50 35 60 48 Q 50 61 40 48 Z" fill="url(#loginGrad)" opacity="0.3"/>
  </g>

  <!-- TEXTO PRINCIPAL -->
  <text x="150" y="115" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-weight="800" font-size="32" fill="#0E2A47" letter-spacing="4" text-anchor="middle">ORIGEN</text>

  <!-- LEYENDA / SLOGAN -->
  <text x="150" y="140" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="11" fill="#06B6D4" letter-spacing="3" text-anchor="middle">SALUD &amp; SALUD FAMILIAR</text>
  
  <text x="150" y="160" font-family="'Inter', Arial, sans-serif" font-weight="400" font-size="11" fill="#64748B" text-anchor="middle">Conectados por tu salud</text>
</svg>
